[binaries]
c = ['clang-16', '--target=arm-linux-gnueabihf']
cpp = ['clang++-16', '--target=arm-linux-gnueabihf']
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'pkg-config'
exe_wrapper = ['qemu-arm', '-cpu', 'cortex-a7', '-L', '/']

[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['/usr/lib/arm-linux-gnueabihf/pkgconfig', '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'

[built-in options]
# Debian armhf baseline: ARMv7-A, Thumb-2, VFPv3-D16 hard-float.  Runs on
# Pi 2/3/4/5 and Zero 2 W; ARMv6 Pi 1 / Zero (1) is out of scope.
# Clang 16 lacks C++23 P2448's relaxed constexpr function definition check.
# Actual constant evaluation is still checked by the compiler.
c_args = ['-march=armv7-a', '-mfpu=vfpv3-d16', '-mfloat-abi=hard', '-mthumb']
cpp_args = ['-march=armv7-a', '-mfpu=vfpv3-d16', '-mfloat-abi=hard', '-mthumb', '-Wno-invalid-constexpr', '-DFMT_HEADER_ONLY']
c_link_args = ['-march=armv7-a', '-mfloat-abi=hard']
cpp_link_args = ['-march=armv7-a', '-mfloat-abi=hard']
