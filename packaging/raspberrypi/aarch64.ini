[binaries]
c = ['clang-16', '--target=aarch64-linux-gnu']
cpp = ['clang++-16', '--target=aarch64-linux-gnu']
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'
exe_wrapper = ['qemu-aarch64', '-cpu', 'cortex-a53', '-L', '/']

[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['/usr/lib/aarch64-linux-gnu/pkgconfig', '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[built-in options]
# Clang 16 lacks C++23 P2448's relaxed constexpr function definition check.
# Actual constant evaluation is still checked by the compiler.
c_args = ['-march=armv8-a']
cpp_args = ['-march=armv8-a', '-Wno-invalid-constexpr', '-DFMT_HEADER_ONLY']
