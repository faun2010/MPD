[binaries]
c = ['clang-16', '--target=arm-linux-gnueabihf', '--sysroot=/sysroot/bullseye-armhf']
cpp = ['clang++-16', '--target=arm-linux-gnueabihf', '--sysroot=/sysroot/bullseye-armhf']
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'pkg-config'
# -L alone lets QEMU fall back to the image's own Bookworm armhf libraries, so
# the search path is pinned inside the sysroot as well.
exe_wrapper = ['qemu-arm', '-cpu', 'cortex-a7', '-L', '/sysroot/bullseye-armhf',
               '-E', 'LD_LIBRARY_PATH=/sysroot/bullseye-armhf/lib/arm-linux-gnueabihf:/sysroot/bullseye-armhf/usr/lib/arm-linux-gnueabihf']

[properties]
needs_exe_wrapper = true
sys_root = '/sysroot/bullseye-armhf'
pkg_config_libdir = ['/sysroot/bullseye-armhf/usr/lib/arm-linux-gnueabihf/pkgconfig',
                     '/sysroot/bullseye-armhf/usr/share/pkgconfig',
                     '/sysroot/bullseye-armhf/usr/lib/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'

[built-in options]
# ARMv7-A with NEON and VFPv4: every Pi with a 32-bit ARMv7 userspace has NEON
# (Cortex-A7/A53/A72), and DSD to PCM conversion and DST decoding are the hot
# paths that need it.  Thumb-2 is Debian armhf's default and denser than ARM.
# ARMv6 Pi 1 / Zero (1) is out of scope, and could not be supported here anyway
# because the prebuilt GCC 12 libstdc++.a linked in below is itself ARMv7.
# Bullseye has only fmt 7, so the sysroot carries Bookworm's header-only fmt 9.
# Clang 16 lacks C++23 P2448's relaxed constexpr function definition check;
# actual constant evaluation is still checked by the compiler.
c_args = ['-march=armv7-a', '-mfpu=neon-vfpv4', '-mfloat-abi=hard', '-pthread']
cpp_args = ['-march=armv7-a', '-mfpu=neon-vfpv4', '-mfloat-abi=hard', '-pthread',
            '-nostdinc++',
            '-isystem', '/opt/gcc12-cxx/12',
            '-isystem', '/opt/gcc12-cxx/12/arm-linux-gnueabihf',
            '-isystem', '/opt/gcc12-cxx/12/backward',
            '-Wno-invalid-constexpr', '-DFMT_HEADER_ONLY']
# libstdc++ and libgcc are linked statically, so nothing depends on Bullseye's
# GCC 10 runtime; compat.o supplies the two glibc symbols newer than 2.31.
# glibc only merged pthread into libc in 2.34, so the static libstdc++ needs an
# explicit libpthread; --no-as-needed keeps it even where meson lists it early.
c_link_args = ['-march=armv7-a', '-mfpu=neon-vfpv4', '-mfloat-abi=hard',
               '/opt/glibc231-compat/compat.o']
cpp_link_args = ['-march=armv7-a', '-mfpu=neon-vfpv4', '-mfloat-abi=hard',
                 '-static-libstdc++', '-static-libgcc',
                 '-L/usr/lib/gcc-cross/arm-linux-gnueabihf/12',
                 '/opt/glibc231-compat/compat.o',
                 '-Wl,--push-state,--no-as-needed', '-lpthread', '-Wl,--pop-state']
